name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests
        run: go test ./...
      - name: Build
        run: go build ./cmd/codexpc
